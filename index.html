<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>كشف الحضور</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mute:#5b6478;--line:#d9deea;--pri:#14213d;--onpri:#fff;
--p:#146c43;--pb:#dff3e8;--l:#a15c07;--lb:#fdecd0;--a:#b42318;--ab:#fde4e1;--n:#6b7280;--nb:#eceff4}
@media(prefers-color-scheme:dark){:root{--bg:#0e131f;--card:#171e2e;--ink:#e8ecf5;--mute:#9aa4ba;--line:#2a3347;--pri:#e8ecf5;--onpri:#14213d;
--p:#6ee7a1;--pb:#12351f;--l:#fbbf5a;--lb:#3a2a0d;--a:#ff8f84;--ab:#3d1713;--n:#a3acbd;--nb:#222b3e}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:640px;margin:0 auto;padding:0 14px 120px}
h1{font-size:22px;margin:0;flex:1}
h2{font-size:18px;margin:18px 0 8px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:46px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
button.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
button.lnk{border:0;background:none;text-decoration:underline;color:var(--mute);min-height:40px}
input[type=text],input[type=search],select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.top button{min-height:42px;padding:6px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.cls{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start}
.cls b{font-size:19px}.mute{color:var(--mute);font-size:15px}
.note{color:var(--mute);font-size:15px;margin:14px 2px}
label{display:block;margin:12px 0 4px;font-weight:600}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:4px 0}
.chk input{width:22px;height:22px}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:start}
.wrap{overflow-x:auto}
#cnt{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pill{border-radius:10px;padding:6px 4px;text-align:center;font-weight:700;font-size:15px;line-height:1.3}
.pill b{display:block;font-size:22px}
.s-p{background:var(--pb);color:var(--p)}.s-l{background:var(--lb);color:var(--l)}.s-a{background:var(--ab);color:var(--a)}.s-n{background:var(--nb);color:var(--n)}
.tools{display:flex;gap:8px;align-items:center;margin:6px 0 10px}
.tools label{margin:0;font-weight:400;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tools input[type=checkbox]{width:20px;height:20px}
.row{display:flex;align-items:center;gap:10px;min-height:62px;margin:6px 0;padding:8px 14px;border-radius:14px;border:2px solid transparent;user-select:none;-webkit-tap-highlight-color:transparent}
.row.s-n{background:var(--card);border-color:var(--line);color:var(--ink)}
.row .nm{flex:1;min-width:0}.row .nm b{display:block;font-size:18px;overflow-wrap:anywhere}.row .nm span{font-size:14px;opacity:.8}
.chip{font-weight:700;font-size:15px;border-radius:999px;padding:5px 12px;background:rgba(127,127,127,.18);white-space:nowrap}
.x{border-color:var(--a);color:var(--a);padding:4px 12px;min-height:40px}
#foot{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:2px}
#foot .big{width:100%;max-width:612px;min-height:54px;font-size:18px}
.add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.add.one{grid-template-columns:1fr auto}
.empty{text-align:center;color:var(--mute);padding:30px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='att_v2';
let S={classes:[],view:'home',cur:null,draft:null,q:'',edit:false,left:false,d:null};
try{S.classes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S.classes))}catch(e){alert('مش قادر أحفظ على الموبايل ده. تأكد إن التصفح الخاص مقفول.')}};
const cur=()=>S.classes.find(c=>c.id===S.cur);
const g=r=>r.a[S.d]||'';
const ST={p:'حاضر (1)',l:'متأخر (½)',a:'غايب (0)'},PTS={p:1,l:.5,a:0},NEXT={'':'p',p:'l',l:'a',a:''};
const b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0)).buffer;
const tx=v=>v==null||v instanceof Date?'':typeof v=='object'?String(v.text||(v.richText||[]).map(x=>x.text).join('')||v.result||''):String(v).trim();
const pad=n=>String(n).padStart(2,'0');
function dateOf(v){if(v instanceof Date)return v.toISOString().slice(0,10);const s=tx(v);let m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);m=s.match(/^\d{4}-\d{2}-\d{2}/);return m?m[0]:null}
const fmt=i=>i.split('-').reverse().join('-');
const today=()=>{const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const dayName=i=>new Date(i+'T12:00:00').toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long'});
const loadE=()=>window.ExcelJS?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});

/* ---------- استيراد الشيت ---------- */
async function onFile(e){const f=e.target.files[0];if(!f)return;
 try{await loadE();const buf=await f.arrayBuffer(),wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);
  const sheets=wb.worksheets.map(ws=>{let hr=1;
   for(let i=1;i<=Math.min(10,ws.rowCount);i++){if(ws.getRow(i).values.some(v=>/اسم|name/i.test(tx(v)))){hr=i;break}}
   const hv=ws.getRow(hr).values,n=Math.max(0,hv.length-1),heads=Array(n).fill(''),dates=[];
   hv.forEach((v,c)=>{if(!c)return;const d=dateOf(v);if(d)dates.push({c,iso:d});else heads[c-1]=tx(v)||'عمود '+c});
   const rows=[];for(let r=hr+1;r<=ws.rowCount;r++){const v=ws.getRow(r).values;rows.push({r,v:heads.map((_,i)=>tx(v[i+1]))})}
   return{name:ws.name,heads,dates,rows}}).filter(s=>s.rows.length);
  if(!sheets.length){alert('الملف مفيهوش صفوف طلاب.');return}
  S.draft={buf,sheets,si:0};guess();S.view='map';render();
 }catch(err){alert('مقدرتش أقرأ الملف. لازم يكون Excel (.xlsx) وأول مرة محتاج نت.')}
 e.target.value=''}
function guess(){const d=S.draft,sh=d.sheets[d.si],h=sh.heads;
 d.nc=Math.max(0,h.findIndex(x=>/اسم|name|student/i.test(x)));
 d.ic=h.findIndex(x=>/تليفون|تلفون|موبايل|phone|mobile|email|\bid\b/i.test(x));
 d.show=[];d.cname=sh.name}
function dset(k,v){S.draft[k]=k=='cname'?v:+v;if(k=='si')guess();if(k!='cname')render()}
function dshow(i,on){const s=S.draft.show,j=s.indexOf(i);if(on&&j<0)s.push(i);if(!on&&j>=0)s.splice(j,1);render()}
function saveCls(){const d=S.draft,sh=d.sheets[d.si];
 const rows=sh.rows.filter(x=>x.v[d.nc]).map(x=>({k:'r'+x.r,r:x.r,v:x.v,a:{}}));
 const c={id:Date.now(),name:(d.cname||'').trim()||'فصل',buf:b64(d.buf),sheet:sh.name,nc:d.nc,ic:d.ic,show:d.show.slice(),cols:sh.heads,dates:sh.dates,rows};
 S.classes.push(c);save();S.draft=null;go('date',c.id)}

/* ---------- الشاشات ---------- */
function go(v,id){S.view=v;if(id)S.cur=id;S.q='';S.edit=false;S.left=false;render()}
function pick(i){S.d=i;go('att')}
function homeV(){
 const list=S.classes.map(c=>`<button class="card cls" onclick="go('date',${c.id})"><span><b>${esc(c.name)}</b><br><span class="mute">${c.rows.length} طالب · ${c.dates.length} حصص في الشيت</span></span><span class="mute">فتح ◂</span></button>`).join('');
 return `<div class="top"><h1>كشف الحضور</h1></div>
 ${list||'<div class="empty">لسه مفيش فصول. استورد شيت الفصل (Excel) مرة واحدة.</div>'}
 <label class="card cls" style="cursor:pointer;justify-content:center;font-weight:700"><input type="file" accept=".xlsx" onchange="onFile(event)" hidden>+ استيراد شيت الفصل (Excel)</label>
 <p class="note">الشيت بيتخزن على الموبايل ده بس. التصدير بيعمل نسخة جديدة والأصل مش بيتعدّل.</p>`}
function mapV(){const d=S.draft,sh=d.sheets[d.si],h=sh.heads;
 const opt=(sel,none)=>(none?`<option value="-1" ${sel<0?'selected':''}>مفيش</option>`:'')+h.map((x,i)=>x?`<option value="${i}" ${sel==i?'selected':''}>${esc(x)}</option>`:'').join('');
 const cols=[d.nc].concat(d.ic>=0?[d.ic]:[]).concat(d.show);
 const pv=sh.rows.filter(r=>r.v[d.nc]).slice(0,3).map(r=>`<tr>${cols.map(i=>`<td>${esc(r.v[i])}</td>`).join('')}</tr>`).join('');
 return `<div class="top"><button onclick="go('home')">رجوع</button><h1>إعداد الكشف</h1></div>
 <div class="card">
 ${d.sheets.length>1?`<label>الشيت</label><select onchange="dset('si',this.value)">${d.sheets.map((s,i)=>`<option value="${i}" ${i==d.si?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:''}
 <label>اسم الفصل</label><input type="text" value="${esc(d.cname)}" oninput="dset('cname',this.value)">
 <label>عمود اسم الطالب</label><select onchange="dset('nc',this.value)">${opt(d.nc)}</select>
 <label>عمود رقم التليفون (اختياري)</label><select onchange="dset('ic',this.value)">${opt(d.ic,1)}</select>
 <label>أعمدة تظهر تحت الاسم (اختياري)</label>
 ${h.map((x,i)=>!x||i==d.nc||i==d.ic?'':`<label class="chk"><input type="checkbox" ${d.show.includes(i)?'checked':''} onchange="dshow(${i},this.checked)">${esc(x)}</label>`).join('')}
 </div>
 <h2>معاينة أول 3 طلاب</h2><div class="wrap"><table><tr>${cols.map(i=>`<th>${esc(h[i])}</th>`).join('')}</tr>${pv}</table></div>
 <p class="note">${sh.rows.filter(r=>r.v[d.nc]).length} طالب. ${sh.dates.length?`لقيت ${sh.dates.length} عمود تواريخ: ${sh.dates.map(x=>fmt(x.iso)).join('، ')}`:'<b>مفيش أعمدة تواريخ في الشيت ده!</b> أضفها في Excel الأول.'}</p>
 <button class="pri" style="width:100%;min-height:54px" onclick="saveCls()">حفظ الفصل</button>`}
function dateV(){const c=cur();if(!c){go('home');return ''}
 const t=today(),has=c.dates.some(x=>x.iso==t),n=i=>c.rows.filter(r=>r.a[i]).length;
 const btn=x=>`<button class="card cls" onclick="pick('${x.iso}')"><span><b>${dayName(x.iso)} ${fmt(x.iso)}</b><br><span class="mute">${n(x.iso)?`اتسجل ${n(x.iso)} من ${c.rows.length}`:'لسه'}${x.iso==t?' · النهارده':''}</span></span><span class="mute">◂</span></button>`;
 const body=!c.dates.length?'<div class="empty">الشيت ده مفيهوش أعمدة تواريخ. أضفها في Excel واستورده تاني.</div>':
  (has?`<div class="card"><b>النهارده ${dayName(t)} ${fmt(t)}</b><p class="mute">دي حصة النهارده؟</p><button class="pri" style="width:100%" onclick="pick('${t}')">أيوه، سجّل حصة النهارده</button></div><h2>أو اختار حصة تانية</h2>`:'<h2>الحصة بتاريخ أنهي يوم؟</h2>')+c.dates.slice().sort((a,b)=>a.iso<b.iso?-1:1).map(btn).join('');
 return `<div class="top"><button onclick="go('home')">رجوع</button><h1>${esc(c.name)}</h1></div>${body}`}
function attV(){const c=cur();if(!c||!S.d){go('date');return ''}
 return `<div class="top"><button onclick="go('date')">رجوع</button><h1>${esc(c.name)} · ${fmt(S.d)}</h1><button onclick="S.edit=!S.edit;render()">${S.edit?'تم':'تعديل'}</button></div>
 ${S.edit?editV(c):''}
 <div id="cnt"></div>
 <div class="tools"><input type="search" placeholder="بحث بالاسم أو الرقم" value="${esc(S.q)}" oninput="S.q=this.value;upd()"><label><input type="checkbox" ${S.left?'checked':''} onchange="S.left=this.checked;upd()">الباقي بس</label></div>
 <div id="list"></div><div id="foot"></div>`}
function editV(c){const one=c.ic<0;
 return `<div class="card"><b>إضافة طالب</b><div class="add ${one?'one':''}" style="margin-top:8px">
 <input type="text" id="an" placeholder="الاسم">${one?'':'<input type="text" id="ai" placeholder="رقم التليفون" inputmode="tel">'}
 <button class="pri" onclick="addS()">إضافة</button></div>
 <p class="mute" style="margin:10px 0 4px">الطالب الجديد بيتضاف في آخر النسخة المصدَّرة. اضغط × لحذفه من الموقع بس.</p>
 <button onclick="clearDay()">مسح حضور اليوم ده</button> <button class="x" onclick="delCls()">حذف الفصل</button></div>`}
function upd(){const c=cur();if(S.view!='att'||!c)return;
 const n=k=>c.rows.filter(r=>g(r)==k).length,left=n('');
 $('#cnt').innerHTML=[['p','حاضر'],['l','متأخر'],['a','غايب'],['n','باقي']].map(([k,t])=>`<div class="pill s-${k}"><b>${k=='n'?left:n(k)}</b>${t}</div>`).join('');
 const q=S.q.trim().toLowerCase();
 const l=c.rows.map((r,i)=>[r,i]).filter(([r])=>(!S.left||!g(r))&&(!q||r.v.join(' ').toLowerCase().includes(q)));
 $('#list').innerHTML=l.length?l.map(([r,i])=>{const sub=[c.ic].concat(c.show).filter(x=>x>=0&&r.v[x]).map(x=>esc(r.v[x])).join(' · ');
  return `<div class="row s-${g(r)||'n'}" ${S.edit?'':`role="button" tabindex="0" onclick="tap(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tap(${i})}"`}>
  <div class="nm"><b>${esc(r.v[c.nc])}</b>${sub?`<span>${sub}</span>`:''}</div>
  ${S.edit?`<button class="x" onclick="delS(${i})" aria-label="حذف">×</button>`:`<span class="chip">${g(r)?ST[g(r)]:'لسه'}</span>`}</div>`}).join(''):'<div class="empty">مفيش نتائج.</div>';
 $('#foot').innerHTML=`<button class="big pri" ${left?'disabled':''} onclick="exp()">${left?`باقي ${left} من غير تسجيل`:'تصدير نسخة الشيت'}</button>${left?'<button class="lnk" onclick="restAbs()">سجّل الباقي غايب</button>':''}`}
function render(){$('#app').innerHTML=S.view=='map'&&S.draft?mapV():S.view=='att'?attV():S.view=='date'?dateV():homeV();if(S.view=='att')upd();window.scrollTo(0,0)}

/* ---------- الأفعال ---------- */
function tap(i){const r=cur().rows[i],v=NEXT[g(r)];if(v)r.a[S.d]=v;else delete r.a[S.d];save();upd()}
function restAbs(){const c=cur(),n=c.rows.filter(r=>!g(r)).length;if(!confirm(`${n} طالب هيتسجلوا غايب. متأكد؟`))return;c.rows.forEach(r=>{if(!g(r))r.a[S.d]='a'});save();upd()}
function addS(){const c=cur(),nm=$('#an').value.trim();if(!nm)return $('#an').focus();
 const v=c.cols.map(()=>'');v[c.nc]=nm;if(c.ic>=0)v[c.ic]=($('#ai')||{value:''}).value.trim();
 c.rows.push({k:'n'+Date.now(),r:null,v,a:{}});save();$('#an').value='';if($('#ai'))$('#ai').value='';upd();$('#an').focus()}
function delS(i){const c=cur();if(!confirm(`حذف ${c.rows[i].v[c.nc]} من الموقع؟`))return;c.rows.splice(i,1);save();upd()}
function clearDay(){if(!confirm('مسح حضور '+fmt(S.d)+' بس؟'))return;cur().rows.forEach(r=>delete r.a[S.d]);save();upd()}
function delCls(){const c=cur();if(!confirm(`حذف فصل "${c.name}" بكل طلابه من الموبايل ده؟`))return;S.classes=S.classes.filter(x=>x!==c);save();go('home')}
async function exp(){const c=cur();
 try{await loadE();const wb=new ExcelJS.Workbook();await wb.xlsx.load(unb64(c.buf));const ws=wb.getWorksheet(c.sheet);
  let n=Math.max(ws.rowCount,...c.rows.map(x=>x.r||0));
  c.rows.forEach(r=>{let row;
   if(r.r)row=ws.getRow(r.r);else{r.r=++n;row=ws.getRow(r.r);row.getCell(c.nc+1).value=r.v[c.nc];if(c.ic>=0)row.getCell(c.ic+1).value=r.v[c.ic]}
   c.dates.forEach(d=>{if(r.a[d.iso])row.getCell(d.c).value=PTS[r.a[d.iso]]});row.commit()});
  save();
  const name='attendance-'+c.name.replace(/[\\/:*?"<>|\s]+/g,'_')+'-'+S.d+'.xlsx';
  const file=new File([await wb.xlsx.writeBuffer()],name,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name=='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)
 }catch(err){alert('التصدير فشل. لو أول مرة، افتح الموقع بنت مرة واحدة.')}}

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
