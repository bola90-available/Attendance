<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>كشف الحضور</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mute:#5b6478;--line:#d9deea;--pri:#14213d;--onpri:#fff;
--p:#146c43;--pb:#dff3e8;--l:#a15c07;--lb:#fdecd0;--a:#b42318;--ab:#fde4e1;--n:#6b7280;--nb:#eceff4}
@media(prefers-color-scheme:dark){:root{--bg:#0e131f;--card:#171e2e;--ink:#e8ecf5;--mute:#9aa4ba;--line:#2a3347;--pri:#e8ecf5;--onpri:#14213d;
--p:#6ee7a1;--pb:#12351f;--l:#fbbf5a;--lb:#3a2a0d;--a:#ff8f84;--ab:#3d1713;--n:#a3acbd;--nb:#222b3e}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:640px;margin:0 auto;padding:0 14px 120px}
h1{font-size:22px;margin:0;flex:1}
h2{font-size:18px;margin:18px 0 8px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:46px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
button.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
button.lnk{border:0;background:none;text-decoration:underline;color:var(--mute);min-height:40px}
input[type=text],input[type=search],select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.top button{min-height:42px;padding:6px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.cls{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start}
.cls b{font-size:19px}.mute{color:var(--mute);font-size:15px}
.note{color:var(--mute);font-size:15px;margin:14px 2px}
label{display:block;margin:12px 0 4px;font-weight:600}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:4px 0}
.chk input{width:22px;height:22px}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:start}
.wrap{overflow-x:auto}
#cnt{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pill{border-radius:10px;padding:6px 4px;text-align:center;font-weight:700;font-size:15px;line-height:1.3}
.pill b{display:block;font-size:22px}
.s-p{background:var(--pb);color:var(--p)}.s-l{background:var(--lb);color:var(--l)}.s-a{background:var(--ab);color:var(--a)}.s-n{background:var(--nb);color:var(--n)}
.tools{display:flex;gap:8px;align-items:center;margin:6px 0 10px}
.tools label{margin:0;font-weight:400;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tools input[type=checkbox]{width:20px;height:20px}
.row{display:flex;align-items:center;gap:10px;min-height:62px;margin:6px 0;padding:8px 14px;border-radius:14px;border:2px solid transparent;user-select:none;-webkit-tap-highlight-color:transparent}
.row.s-n{background:var(--card);border-color:var(--line);color:var(--ink)}
.row .nm{flex:1;min-width:0}.row .nm b{display:block;font-size:18px;overflow-wrap:anywhere}.row .nm span{font-size:14px;opacity:.8}
.chip{font-weight:700;font-size:15px;border-radius:999px;padding:5px 12px;background:rgba(127,127,127,.18);white-space:nowrap}
.x{border-color:var(--a);color:var(--a);padding:4px 12px;min-height:40px}
#foot{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:2px}
#foot .big{width:100%;max-width:612px;min-height:54px;font-size:18px}
.add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.add.one{grid-template-columns:1fr auto}
.empty{text-align:center;color:var(--mute);padding:30px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='att_v1';
let S={classes:[],view:'home',cur:null,draft:null,q:'',edit:false,left:false};
try{S.classes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S.classes))}catch(e){alert('مش قادر أحفظ على الموبايل ده. تأكد إن التصفح الخاص مقفول.')}};
const cur=()=>S.classes.find(c=>c.id===S.cur);
const ST={p:'حاضر',l:'متأخر (0 نقطة)',a:'غايب'};
const NEXT={'':'p',p:'l',l:'a',a:''};

/* ---------- قراءة الملفات ---------- */
function parseCSV(t){const r=[];let row=[],f='',q=false;t=t.replace(/^\uFEFF/,'');
for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;
 else if(c==','){row.push(f);f=''}
 else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=''}
 else f+=c}
if(f||row.length){row.push(f);r.push(row)}return r}
const loadX=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function onFile(e){const f=e.target.files[0];if(!f)return;
 try{let sheets;
  if(/\.csv$/i.test(f.name)){sheets=[{name:f.name.replace(/\.\w+$/,''),data:parseCSV(new TextDecoder('utf-8').decode(await f.arrayBuffer()))}]}
  else{await loadX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
   sheets=wb.SheetNames.map(n=>({name:n,data:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})}))}
  sheets=sheets.map(s=>({name:s.name,data:s.data.filter(r=>r.some(c=>String(c).trim()))})).filter(s=>s.data.length>1);
  if(!sheets.length){alert('الملف مفيهوش صفوف طلاب.');return}
  S.draft={sheets,si:0};guess();S.view='map';render();
 }catch(err){alert('مقدرتش أقرأ الملف. لو Excel، لازم نت أول مرة بس. أو احفظه CSV وجرّب تاني.')}
 e.target.value=''}
function guess(){const d=S.draft,sh=d.sheets[d.si],h=sh.data[0].map(x=>String(x).trim());
 d.nc=Math.max(0,h.findIndex(x=>/اسم|name|student/i.test(x)));
 d.ic=h.findIndex(x=>/تليفون|تلفون|موبايل|phone|mobile|email|\bid\b/i.test(x));
 d.show=[];d.cname=sh.name}
function dset(k,v){S.draft[k]=k=='cname'?v:+v;if(k=='si')guess();if(k!='cname')render()}
function dshow(i,on){const s=S.draft.show;const j=s.indexOf(i);if(on&&j<0)s.push(i);if(!on&&j>=0)s.splice(j,1);render()}
function saveCls(){const d=S.draft,sh=d.sheets[d.si],h=sh.data[0].map((x,i)=>String(x).trim()||'عمود '+(i+1));
 const rows=sh.data.slice(1).filter(r=>String(r[d.nc]==null?'':r[d.nc]).trim()).map(r=>({v:h.map((_,i)=>String(r[i]==null?'':r[i]).trim()),s:''}));
 const c={id:Date.now(),name:(d.cname||'').trim()||'فصل',cols:h,nc:d.nc,ic:d.ic,show:d.show.slice(),rows};
 S.classes.push(c);save();S.draft=null;S.cur=c.id;S.view='att';S.q='';S.edit=false;S.left=false;render()}

/* ---------- الشاشات ---------- */
function go(v,id){S.view=v;if(id)S.cur=id;S.q='';S.edit=false;S.left=false;render()}
function homeV(){
 const list=S.classes.map(c=>{const d=c.rows.filter(r=>r.s).length;return `<button class="card cls" onclick="go('att',${c.id})"><span><b>${esc(c.name)}</b><br><span class="mute">${c.rows.length} طالب · اتسجل ${d}</span></span><span class="mute">فتح ◂</span></button>`}).join('');
 return `<div class="top"><h1>كشف الحضور</h1></div>
 ${list||'<div class="empty">لسه مفيش فصول. استورد كشف الفصل بتاعك للبداية.</div>'}
 <label class="card cls" style="cursor:pointer;justify-content:center;font-weight:700"><input type="file" accept=".xlsx,.xls,.csv" onchange="onFile(event)" hidden>+ استيراد كشف (Excel أو CSV)</label>
 <p class="note">الأسماء بتتخزن على الموبايل ده بس، ومش بتترفع على أي سيرفر.</p>`}
function mapV(){const d=S.draft,sh=d.sheets[d.si],h=sh.data[0].map((x,i)=>String(x).trim()||'عمود '+(i+1));
 const opt=(sel,none)=>(none?`<option value="-1" ${sel<0?'selected':''}>مفيش</option>`:'')+h.map((x,i)=>`<option value="${i}" ${sel==i?'selected':''}>${esc(x)}</option>`).join('');
 const cols=[d.nc].concat(d.ic>=0?[d.ic]:[]).concat(d.show);
 const pv=sh.data.slice(1,4).map(r=>`<tr>${cols.map(i=>`<td>${esc(r[i])}</td>`).join('')}</tr>`).join('');
 return `<div class="top"><button onclick="go('home')">رجوع</button><h1>إعداد الكشف</h1></div>
 <div class="card">
 ${d.sheets.length>1?`<label>الشيت</label><select onchange="dset('si',this.value)">${d.sheets.map((s,i)=>`<option value="${i}" ${i==d.si?'selected':''}>${esc(s.name)} (${s.data.length-1})</option>`).join('')}</select>`:''}
 <label>اسم الفصل</label><input type="text" value="${esc(d.cname)}" oninput="dset('cname',this.value)">
 <label>عمود اسم الطالب</label><select onchange="dset('nc',this.value)">${opt(d.nc)}</select>
 <label>عمود رقم التليفون (أو أي معرّف) — اختياري</label><select onchange="dset('ic',this.value)">${opt(d.ic,1)}</select>
 <label>أعمدة تظهر تحت الاسم — اختياري</label>
 ${h.map((x,i)=>i==d.nc||i==d.ic?'':`<label class="chk"><input type="checkbox" ${d.show.includes(i)?'checked':''} onchange="dshow(${i},this.checked)">${esc(x)}</label>`).join('')}
 </div>
 <h2>معاينة أول 3 طلاب</h2><div class="wrap"><table><tr>${cols.map(i=>`<th>${esc(h[i])}</th>`).join('')}</tr>${pv}</table></div>
 <p class="note">هتلاقي ${sh.data.length-1} صف. التصدير بيرجّع كل أعمدة الملف الأصلي + عمود Status.</p>
 <button class="pri" style="width:100%;min-height:54px" onclick="saveCls()">حفظ الفصل وبدء الحضور</button>`}
function attV(){const c=cur();if(!c){go('home');return ''}
 return `<div class="top"><button onclick="go('home')">رجوع</button><h1>${esc(c.name)}</h1><button onclick="S.edit=!S.edit;render()">${S.edit?'تم':'تعديل الكشف'}</button></div>
 ${S.edit?editV(c):''}
 <div id="cnt"></div>
 <div class="tools"><input type="search" placeholder="بحث بالاسم أو الرقم" value="${esc(S.q)}" oninput="S.q=this.value;upd()"><label><input type="checkbox" ${S.left?'checked':''} onchange="S.left=this.checked;upd()">الباقي بس</label></div>
 <div id="list"></div><div id="foot"></div>`}
function editV(c){const one=c.ic<0;
 return `<div class="card"><b>إضافة طالب</b><div class="add ${one?'one':''}" style="margin-top:8px">
 <input type="text" id="an" placeholder="الاسم">${one?'':'<input type="text" id="ai" placeholder="رقم التليفون" inputmode="tel">'}
 <button class="pri" onclick="addS()">إضافة</button></div>
 <p class="mute" style="margin:10px 0 4px">أو اضغط × جنب أي طالب لحذفه.</p>
 <button onclick="newSession()">حصة جديدة (مسح الحضور)</button> <button class="x" onclick="delCls()">حذف الفصل</button></div>`}
function upd(){const c=cur();if(S.view!='att'||!c)return;
 const n=k=>c.rows.filter(r=>r.s==k).length,left=n('');
 $('#cnt').innerHTML=[['p','حاضر'],['l','متأخر'],['a','غايب'],['n','باقي']].map(([k,t])=>`<div class="pill s-${k}"><b>${k=='n'?left:n(k)}</b>${t}</div>`).join('');
 const q=S.q.trim().toLowerCase();
 const l=c.rows.map((r,i)=>[r,i]).filter(([r])=>(!S.left||!r.s)&&(!q||r.v.join(' ').toLowerCase().includes(q)));
 $('#list').innerHTML=l.length?l.map(([r,i])=>{const sub=[c.ic].concat(c.show).filter(x=>x>=0&&r.v[x]).map(x=>esc(r.v[x])).join(' · ');
  return `<div class="row s-${r.s||'n'}" ${S.edit?'':`role="button" tabindex="0" onclick="tap(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tap(${i})}"`}>
  <div class="nm"><b>${esc(r.v[c.nc])}</b>${sub?`<span>${sub}</span>`:''}</div>
  ${S.edit?`<button class="x" onclick="delS(${i})" aria-label="حذف">×</button>`:`<span class="chip">${r.s?ST[r.s]:'لسه'}</span>`}</div>`}).join(''):'<div class="empty">مفيش نتائج.</div>';
 $('#foot').innerHTML=`<button class="big pri" ${left?'disabled':''} onclick="exp()">${left?`باقي ${left} من غير تسجيل`:'تصدير الحضور'}</button>${left?'<button class="lnk" onclick="restAbs()">سجّل الباقي غايب</button>':''}`}
function render(){$('#app').innerHTML=S.view=='map'&&S.draft?mapV():S.view=='att'?attV():homeV();if(S.view=='att')upd();window.scrollTo(0,0)}

/* ---------- الأفعال ---------- */
function tap(i){const r=cur().rows[i];r.s=NEXT[r.s];save();upd()}
function restAbs(){const c=cur(),n=c.rows.filter(r=>!r.s).length;if(!confirm(`${n} طالب هيتسجلوا غايب. متأكد؟`))return;c.rows.forEach(r=>{if(!r.s)r.s='a'});save();upd()}
function addS(){const c=cur(),nm=$('#an').value.trim();if(!nm)return $('#an').focus();
 const v=c.cols.map(()=>'');v[c.nc]=nm;if(c.ic>=0)v[c.ic]=($('#ai')||{value:''}).value.trim();
 c.rows.push({v,s:''});save();$('#an').value='';if($('#ai'))$('#ai').value='';upd();$('#an').focus()}
function delS(i){const c=cur();if(!confirm(`حذف ${c.rows[i].v[c.nc]} من الكشف؟`))return;c.rows.splice(i,1);save();upd()}
function newSession(){if(!confirm('مسح كل الحضور المسجل وبدء حصة جديدة؟'))return;cur().rows.forEach(r=>r.s='');save();upd()}
function delCls(){const c=cur();if(!confirm(`حذف فصل "${c.name}" بكل طلابه من الموبايل ده؟`))return;S.classes=S.classes.filter(x=>x!==c);save();go('home')}
async function exp(){const c=cur(),m={p:'present',l:'late',a:'absent'};
 const q=x=>'"'+String(x).replace(/"/g,'""')+'"';
 const csv='\uFEFF'+[c.cols.concat('Status')].concat(c.rows.map(r=>r.v.concat(m[r.s]))).map(r=>r.map(q).join(',')).join('\r\n');
 const t=new Date(),ymd=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
 const name='attendance-'+c.name.replace(/[\\/:*?"<>|\s]+/g,'_')+'-'+ymd+'.csv';
 const file=new File([csv],name,{type:'text/csv'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name=='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

if(S.classes.length==1){S.cur=S.classes[0].id}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
